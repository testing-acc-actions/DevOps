name: Academy quality checks

on:
  push:
    branches: [main, feature/academy-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check curriculum.js
          node --check interview-bank.js
      - name: Validate curriculum structure
        run: node scripts/validate-curriculum.cjs
